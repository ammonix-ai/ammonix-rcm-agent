name: Nightly determinism

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "ammonix_core[dev]"
      - name: Re-verify every pinned artefact hash
        run: python scripts/determinism_check.py
